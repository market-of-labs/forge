version: 2

# 本仓库只有两个依赖（`fetch-executor` 里的 `actions/cache@v6` 与
# `robinraju/release-downloader@v1`）。它们用的是主版本标签，不配这个就等于钉死在当前
# 主版本上，而那两个 action 跑的 job 握着能跨仓库的 PAT。
# Dependabot 只开 PR、不合并、不打 tag，碰不到"取执行体 → 执行"那条链。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 只有两个依赖，合成一个 PR。
    groups:
      actions:
        patterns: ['*']
