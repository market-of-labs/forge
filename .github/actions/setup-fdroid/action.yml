name: setup-fdroid
description: >-
  装上这条流水线要的整条工具链（jarsigner / bash / node / git / …），并把每个工具的版本
  打进 step summary。`fdroidserver` **默认不装**，只有 `verify-index` 那个手动入口按需要它。

# 这条 apt 清单里少装哪一样，整条入口就莫名其妙地红：`bash` 不是可有可无的包
# （容器 job 的默认 shell 是 sh(dash)，Debian 基础镜像里没有 bash），而 `git` 是
# 二进制自己（`internal/gitx`）浅克隆 store、推送回写要用的。
# `container:` 是 job 级键，composite action 里放不了，那几项仍在各 workflow 里各写一遍。
inputs:
  # 例行那条路上（`reconcile` / `source-change` / `intake-incoming`）扫描、写索引、签名
  # 全是纯 Go 的，一个子进程都不开 ⇒ fdroidserver 在那里连被调用都不可能。它现在只有一个
  # 用处：在手动触发的 `verify-index` 里当**第二个生产者**（同样的账本喂给另一个实现，
  # 产物必须逐字相等）。装它要连 androguard 一起拉进来（几百 MB、几十秒），放在默认清单里
  # 就是每轮例行都白付一次，而它的缺席不会让任何一个例行步骤变红 —— 这种"装了但没人用"
  # 的包是最容易被误读成依赖的东西。
  fdroidserver:
    description: >-
      是否装 `fdroidserver`（连同 androguard）。默认 `false`；只有 `verify-index` 传 `true`。
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # default-jdk-headless 提供 `jarsigner`（JAR 签名唯一的**外部**裁判，`check-repo` 要求它
    # 报出字面量 `jar verified.`）；nodejs 给 `fetch-executor` 里那个 JS action
    # （`robinraju/release-downloader`）用；unzip / jq / curl / ca-certificates 供断言步骤
    # 与 HTTPS 取件。容器里就是 root，不需要 sudo。
    - name: Install the toolchain
      shell: bash
      env:
        WITH_FDROIDSERVER: ${{ inputs.fdroidserver }}
      run: |
        set -euo pipefail
        pkgs=(default-jdk-headless bash nodejs git unzip jq curl ca-certificates)
        if [ "$WITH_FDROIDSERVER" = "true" ]; then
          pkgs+=(fdroidserver)
        fi
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

        # 把版本打进 summary：fdroidserver / androguard 的行为随版本变，结论要能对应到
        # 具体版本才有意义。表统一打全（不按入口裁剪），**没装的那两行也照样打** ——
        # 「这一轮没装它」与「装了但版本是空」是两件事，字面量摆在那里就不用猜。
        # 用 command -v 判在场：直接跑 `python3 --version` 在缺它时会把
        # `bash: python3: command not found` 当成版本打进表里。
        {
          echo "### 环境"
          echo
          echo '| 工具 | 输出 |'
          echo '|---|---|'
          if command -v fdroid >/dev/null 2>&1; then
            echo "| \`fdroid\` | $(fdroid --version 2>&1 | head -1) |"
            echo "| \`androguard\`(dpkg) | $(dpkg-query -W -f='${Version}' python3-androguard 2>/dev/null || echo '未知') |"
          else
            echo "| \`fdroid\` | **本入口不装**（只有核对入口需要它当第二个生产者） |"
          fi
          echo "| \`jarsigner\` | \`$(command -v jarsigner || echo '**不在 PATH**')\` |"
          echo "| \`java\` | $(java -version 2>&1 | head -1) |"
          echo "| \`git\` | $(git --version 2>&1) |"
          echo "| \`node\` | $(node --version 2>&1 | head -1) |"
          echo "| \`python3\` | $(command -v python3 >/dev/null 2>&1 && python3 --version 2>&1 || echo '**不在 PATH**') |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
