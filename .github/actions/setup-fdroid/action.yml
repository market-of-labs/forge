name: setup-fdroid
description: >-
  装上这条流水线要的整条工具链（fdroidserver / jarsigner / bash / node / git / …），
  并把每个工具的版本打进 step summary。

# 这条 apt 清单里少装哪一样，整条入口就莫名其妙地红：`bash` 不是可有可无的包
# （容器 job 的默认 shell 是 sh(dash)，Debian 基础镜像里没有 bash），而 `git` 是
# 二进制自己（`internal/gitx`）浅克隆 store、推送回写要用的。
# `container:` 是 job 级键，composite action 里放不了，那几项仍在各 workflow 里各写一遍。
runs:
  using: composite
  steps:
    # fdroidserver 生成索引与签名；default-jdk-headless 提供 `jarsigner`（JAR 签名的唯一
    # 实现路径）；nodejs 给两个 JS action 用；unzip / jq / curl / ca-certificates 供断言
    # 步骤与 HTTPS 取件。容器里就是 root，不需要 sudo。
    - name: Install the toolchain
      shell: bash
      run: |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          fdroidserver default-jdk-headless bash nodejs git \
          unzip jq curl ca-certificates

        # 把版本打进 summary：fdroidserver / androguard 的行为随版本变，结论要能对应到
        # 具体版本才有意义。表统一打全（不按入口裁剪）。
        {
          echo "### 环境"
          echo
          echo '| 工具 | 输出 |'
          echo '|---|---|'
          echo "| \`fdroid\` | $(fdroid --version 2>&1 | head -1) |"
          echo "| \`androguard\`(dpkg) | $(dpkg-query -W -f='${Version}' python3-androguard 2>/dev/null || echo '未知') |"
          echo "| \`jarsigner\` | \`$(command -v jarsigner || echo '**不在 PATH**')\` |"
          echo "| \`java\` | $(java -version 2>&1 | head -1) |"
          echo "| \`git\` | $(git --version 2>&1) |"
          echo "| \`node\` | $(node --version 2>&1 | head -1) |"
          echo "| \`python3\` | $(python3 --version 2>&1) |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
