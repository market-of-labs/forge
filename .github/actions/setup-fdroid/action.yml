name: setup-fdroid
description: >-
  给**容器 job** 装工具链（bash / git / jq / ca-certificates），并把每个工具的版本
  打进 step summary。`fdroidserver` **默认不装**，只有 `verify-index` 那个手动入口需要它。
  本仓现在只有那一个入口还在调这个动作：例行那三个（`reconcile` / `source-change` /
  `intake-incoming`）已经跑在裸 `ubuntu-latest` 上，一个包都不装。
  任何入口的 apt 清单里都没有 JDK —— `verify-index` 那边会有一个，那是 `fdroidserver`
  的硬依赖被动带来的。

# 这条 apt 清单是**给容器 job 用的**（本仓只剩 `verify-index` 跑在 debian:trixie 里），
# 少装哪一样整条入口就莫名其妙地红：`bash` 不是可有可无的包 —— 容器 job 的默认 shell 是
# sh(dash)，Debian 基础镜像里没有它；`git` 是二进制自己（`internal/gitx`）浅克隆 store、
# 推送回写要用的；`ca-certificates` 是 https 取件与克隆的根证书；`jq` 供断言步骤读
# index-v2.json。`container:` 是 job 级键、composite action 里放不了，所以镜像名仍写在
# workflow 里；`defaults.run.shell: bash` 同理。
#
# 清单里**不再有** `nodejs` / `unzip` / `curl`（2026-09-28 删的，三样都没有调用者）：
# `nodejs` 是**证出来**的 —— `robinraju/release-downloader` 声明 `using: node24`，而
# trixie 的 nodejs 是 20.19.2，它却一直跑得绿 ⇒ 跑 JS action 的是 runner 自带的 node。
# `unzip` / `curl` 在 `forge/.github/**` 里一处都没有（只有这份清单提到过），那个 action
# 自己也只用 npm 的 `tar` 包（`unarchive.ts` 里没有 `child_process`）；Go 的 HTTPS 与
# `git` 都不借这两个二进制。
inputs:
  # `fdroidserver` 为什么不放在默认清单里：它只有一个用处 —— 在手动触发的
  # `verify-index` 里当**第二个生产者**（同样的账本喂给另一个实现，产物必须逐字相等）。
  # 装它要连 androguard 一起拉进来（几百 MB、几十秒），而本仓其余的事（扫描、写索引、
  # 签名、核签名）全是纯 Go，一个子进程都不开。这种"装了但没人用"的包是最容易被误读成
  # 依赖的东西，所以默认关掉、由调用方显式打开。
  fdroidserver:
    description: >-
      是否装 `fdroidserver`（连同 androguard）。默认 `false`；只有 `verify-index` 传 `true`。
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # 这里**不装 JDK**。本仓例行那三个入口（`reconcile` / `source-change` /
    # `intake-incoming`）扫描、写索引、签名、以及**核签名**全是纯 Go 的 —— `entry.jar`
    # 的摘要链与指纹由执行体自己的 `verify-jar` 判，一个子进程都不开 —— 而且它们已经不再
    # 调这个动作了（跑在裸 `ubuntu-latest` 上）。唯一还会带 JDK 的是手动触发的
    # `verify-index`，那是 `fdroidserver` 的**硬依赖**（`Depends`，`--no-install-recommends`
    # 拦不住）被动拉进来的，且那个入口里用 JVM 的是 `fdroid update` 的签名后端，
    # 不是任何一条判据的裁判。容器里就是 root，不需要 sudo。
    - name: Install the toolchain
      shell: bash
      env:
        WITH_FDROIDSERVER: ${{ inputs.fdroidserver }}
      run: |
        set -euo pipefail
        pkgs=(bash git jq ca-certificates)
        if [ "$WITH_FDROIDSERVER" = "true" ]; then
          pkgs+=(fdroidserver)
        fi
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends "${pkgs[@]}"

        # 把版本打进 summary：fdroidserver / androguard 的行为随版本变，结论要能对应到
        # 具体版本才有意义。表统一打全（不按入口裁剪），**没装的那几行也照样打** ——
        # 「这一轮没装它」与「装了但版本是空」是两件事，字面量摆在那里就不用猜。
        # 用 command -v 判在场：直接跑 `python3 --version`（`java -version` 也一样）
        # 在缺它时会把 `bash: xxx: command not found` 当成版本打进表里。
        # `node` 那一行今天就是这么缺的 —— 本动作不再装 nodejs（见上面清单那段）。
        {
          echo "### 环境"
          echo
          echo '| 工具 | 输出 |'
          echo '|---|---|'
          if command -v fdroid >/dev/null 2>&1; then
            echo "| \`fdroid\` | $(fdroid --version 2>&1 | head -1) |"
            echo "| \`androguard\`(dpkg) | $(dpkg-query -W -f='${Version}' python3-androguard 2>/dev/null || echo '未知') |"
          else
            echo "| \`fdroid\` | **本入口不装**（只有核对入口需要它当第二个生产者） |"
          fi
          echo "| \`java\` | $(command -v java >/dev/null 2>&1 && java -version 2>&1 | head -1 || echo '**不在 PATH**（apt 清单里没有 JDK）') |"
          echo "| \`git\` | $(git --version 2>&1) |"
          echo "| \`node\` | $(command -v node >/dev/null 2>&1 && node --version 2>&1 | head -1 || echo '**不在 PATH**（跑 JS action 的是 runner 自带的 node）') |"
          echo "| \`python3\` | $(command -v python3 >/dev/null 2>&1 && python3 --version 2>&1 || echo '**不在 PATH**') |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
