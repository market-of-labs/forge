name: fetch-executor
description: >-
  掩码 PAT、恢复跨轮 APK cache、从 forge-core 的 Release 取执行体（默认浮动取 latest，
  给 `version` 则取那个 tag）并补执行位；最后把执行体路径导出成 `FORGE_EXEC`、
  把 cache 目录导出成 `APK_CACHE_DIR`。

# PAT 会作为 `with.token` 交给第三方 action（`robinraju/release-downloader`）——
# 这是"第三方 action 只进不握 PAT 的 job"那条规矩的已知例外。
inputs:
  token:
    description: 细粒度 PAT。forge-core 是私有仓库，GITHUB_TOKEN 跨不了仓库，所以这里**不能**吃默认值。
    required: true
  asset-name:
    description: >-
      forge-core Release 里那个 asset 的名字。它**同时**就是落盘后的本地文件名，
      所以"下载用的名字"与"执行用的路径"必须是同一个值 —— 做成一个 input 而不是
      两处字面量，正是为了让它们不可能对不上。调用方不需要传（它从不改变，
      而"能改的值"就是"会被改错的值"）。
    required: false
    default: forge-linux-amd64
  version:
    description: >-
      要取的那个 tag（如 `v0.1.18-rc1`）。留空 = 浮动取 latest —— 写 store 的那三个
      workflow 都留空，它们要的是"当前生产那一版"。
      核对 workflow 必须填，而且**只能**填：它要验的是一个预发布 tag，而 `latest`
      按设计跳过预发布 —— 填了才取得到"要核对的那个二进制"。
    required: false
    default: ''
runs:
  using: composite
  steps:
    # 掩码必须最先执行：`::add-mask::` 是 job 级生效，注册之后余下所有 step 的日志
    # （**包括下面那个第三方 action 自己打的**）都会被遮蔽。
    # 顺带把 cache 目录经 $GITHUB_ENV 导出去，给调用方报现场证据用。
    - name: Mask the token and export the cache dir
      shell: bash
      env:
        MASK: ${{ inputs.token }}
        CACHE_DIR: ${{ github.workspace }}/apk-cache
      run: |
        set -euo pipefail
        echo "::add-mask::$MASK"
        echo "APK_CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"

    # 两个写入口共用这一盘 cache、这一个 key 前缀（`fdroid-apks-v1-`）：key 必须是滚动
    # key，绝不能挂在 `hashFiles('sources/**')` 上（那样每改一个来源整盘失效、老版本全丢）。
    # 目录必须在 store 克隆之外 —— 那个克隆每轮都被删。
    # 边界：本 job 只要有任何一个 step 失败，这一轮的 cache 就不会存（`post-if` 是 `success()`）。
    - name: Restore the APK cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/apk-cache
        key: fdroid-apks-v1-${{ github.run_id }}
        restore-keys: |
          fdroid-apks-v1-

    # 浮动取 latest（不钉 tag）：改完代码打个 tag，本仓库一个字都不用动，下一轮就换新版
    # —— 所以**删掉一个动词之前必须先让新二进制发出去**。
    #
    # 传了 `version` 就改取那个 tag。`latest` 与 `tag` 在那个 action 里是互斥的
    # （两个都非空会直接报错），所以这里用 `version` 是否为空来二选一，而不是各传一半。
    - name: Fetch executor
      uses: robinraju/release-downloader@v1
      with:
        repository: market-of-labs/forge-core
        latest: ${{ inputs.version == '' }}
        tag: ${{ inputs.version }}
        fileName: ${{ inputs.asset-name }}
        # 只能是 $GITHUB_WORKSPACE 下的相对路径 —— 本 job 不 checkout，那个目录是空的。
        out-file-path: .
        token: ${{ inputs.token }}

    # Release asset 不带执行位；上面那个 action 只往 $GITHUB_WORKSPACE 里放东西。
    - name: Make executable
      shell: bash
      env:
        EXEC_ASSET: ${{ inputs.asset-name }}
      run: |
        set -euo pipefail
        chmod +x "$GITHUB_WORKSPACE/$EXEC_ASSET"
        echo "FORGE_EXEC=$GITHUB_WORKSPACE/$EXEC_ASSET" >> "$GITHUB_ENV"
