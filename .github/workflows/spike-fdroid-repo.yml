name: spike-fdroid-repo

# ⚠️ 这**不是**生产流程，也**不进** `store-write` 并发队列。
#
# 它是一次性可行性验证：确认「fdroidserver + JDK 的 jarsigner」能在 CI 里生成一个结构
# 合规的 F-Droid 仓库 —— 也就是把 market-spec/spike/FDROID-REPO-REFS.md §7「待实测」
# 里那几条**在真 CI 上跑一遍**，因为本机没有 Debian 环境：
#
#   1. `jarsigner` 到底要不要额外配置 —— CalyxOS 显式 `config['jarsigner'] = which(...)`
#      说明这里有过坑，而这是整条路线唯一还带不确定性的技术点
#   2. `entry.jar` 的 JAR 签名结构是否与客户端期望一致（对照 IzzyOnDroid 那个 4 条目实例）
#   3. `entry.json.index.sha256` → `index-v2.json` 的哈希链是否自洽（客户端安装前会校验）
#   4. 同一 versionCode 的两个 ABI 变体在 index v1 / v2 里**怎么表达**
#   5. `fdroid update` 是否把 APK 改名成 `{pkg}_{versionCode}.apk`（实测：**没有**）
#   6. `nativecode` / `signer` 是否被写进 manifest
#
# ⚠️ **实测记录（两次 run，都在 2026-09-17）—— 结论已成立，这份 workflow 现在只作为回归。**
#
#   ① run 35180635917（ubuntu-latest）：`fdroid update` 直接崩。原因是**版本**不是用法：
#      Ubuntu 24.04 的 `fdroidserver 2.2.1` 带 `androguard 3.4.0~a1-6`，它解析现代 APK
#      （Flutter + 新 AGP）的 `resources.arsc` 时 `raise ResParserError("res1 must be zero!")`。
#      同一文件同一行在 trixie 的 `3.4.0~a1-17` 已改成 `log.warning`、forky 的 `4.1.3` 干脆
#      没有这个检查。⇒ 固定用 `debian:trixie`，**别再改回 ubuntu-latest 自带的包**。
#
#   ② run 35181052991（debian:trixie）：`fdroid update` **成功**（`INFO: Finished`），
#      但 `Assert artifacts` exit 127 —— 容器 job 的默认 shell 是 **sh（dash）**，而 Debian
#      基础镜像里没有 bash，脚本里的 `report+="..."` 被 dash 当成命令名。⇒ 见下面
#      `defaults:` 与 apt 里的 `bash`。
#
#   ③ 同一次 run 的产物已从 artifact 拉下来本地逐条核对，结论（详细版在 REFS §7）：
#      · `entry.jar` = `entry.json` + `MANIFEST.MF` + `{alias}.SF` + `{alias}.RSA` —— 4 条目，
#        与 IzzyOnDroid 的 `NEBO.*` 实例同构
#      · `entry.json` 的 `version` 是 `20002`，且 `.index.sha256` 与实际 `index-v2.json` 一致
#      · fdroidserver 打出 `Creating signed index with this key (SHA256): …`
#        ⇒ **JAR 签名靠 JDK 的 jarsigner 就够**，不必自己实现
#      · v2 的 `versions` map **用 APK 的 sha256 作 key**（不是 versionCode）
#        ⇒ 同一 versionCode 的多个 ABI 变体也能共存
#      · **APK 没有被改名**（`file.name` 就是原始 asset 名）
#      · 两个 ABI 变体的 versionCode **不同**（23563 / 23562）—— 上游如此，
#        而本市场的账本只记了一个：这是一个真实的模型缺口，记在 REFS 里
#
# 它刻意满足本仓库的加固清单（README「加固清单」）：
#   · **不 checkout 任何东西** —— 本仓库没有源码，这个 job 也不需要
#   · **不握任何 secret** —— keystore 现场生成、用完即弃；APK 取自公开上游
#   · **不引用任何第三方 action**（规则 11）；产物上传用官方 `actions/upload-artifact`
#   · 输出里没有 token、没有真实地址（`repo_url` 用 example.com 占位）
#
# ⚠️ 为什么**不加** `concurrency: store-write`：那个组是给"写 store 的 job"排队用的，
# 这个 job 不写 store，进去只会白白占住队列、拖慢真正的维护动作。
#
# ⚠️ 触发面**只留 workflow_dispatch**：按 on-dispatch.yml 的规矩，`release` / `push` 在
# 本仓库没有语义，加了只是白白扩大攻击面（本仓库是公有的）。要重跑就点按钮。

on:
  workflow_dispatch:

# 本 job 不需要 GITHUB_TOKEN 的任何权限：不 checkout、不调 API（APK 走
# `releases/latest/download` 的公开直链）、上传 artifact 用的是 runtime token，
# 不受这个字段影响。
permissions: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    # ⚠️ 必须是 Debian 容器（理由见文件头的 ①）。trixie 是当前 stable，所以这一行
    # 现在是**可复现**的；等它变成 oldstable 之后要再评估一次。
    container:
      image: debian:trixie
    # ⚠️ 容器 job 的默认 shell 是 **sh（dash）**，不是 bash —— Debian 基础镜像里没有
    # bash（理由见文件头的 ②）。少了这一段，任何用 bash 语法的 step 都会以
    # `…: not found` + exit 127 收场，而且报错行号指向函数体、看起来毫无线索。
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      # 被测对象用**公开上游的一个真实 APK**。选 Obtainium 是因为它同时提供
      # arm64-v8a 与 armeabi-v7a 两个变体 —— 一次就能验 ABI 折叠与 nativecode。
      # ⚠️ 依赖 asset 名保持不变；真改了会在下载步骤上明确报错退出，不会静默产出空 repo。
      BASE: https://github.com/ImranR98/Obtainium/releases/latest/download
      PKG: dev.imranr.obtainium
    steps:
      # JDK 只为 `jarsigner` 而装 —— 后者是 JAR 签名的唯一实现路径，装了它就不必自己
      # 实现签名。
      # ⚠️ `bash` 是给上面那个 `defaults:` 用的，**不是**可有可无的包。
      # ⚠️ `nodejs` 是给 `actions/upload-artifact` 用的：**container job 里的 JS action
      # 跑在容器内**，容器里没有 node 它就会失败。
      - name: Install fdroidserver and JDK
        run: |
          set -euo pipefail
          # 容器里就是 root，不需要 sudo。
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            fdroidserver default-jdk-headless bash unzip jq curl ca-certificates nodejs

          # 把版本钉进 summary：fdroidserver/androguard 的行为随版本变（①那次失败
          # 就是版本问题），结论要能对应到具体版本才有意义。
          {
            echo "### 环境"
            echo
            echo '| 工具 | 输出 |'
            echo '|---|---|'
            echo "| \`fdroid\` | $(fdroid --version 2>&1 | head -1) |"
            echo "| \`androguard\`(dpkg) | $(dpkg-query -W -f='${Version}' python3-androguard 2>/dev/null || echo '未知') |"
            echo "| \`jarsigner\` | \`$(command -v jarsigner || echo '**不在 PATH**')\` |"
            echo "| \`java\` | $(java -version 2>&1 | head -1) |"
            echo "| \`bash\` | $(bash --version 2>&1 | head -1) |"
            echo "| \`node\` | $(node --version 2>&1 | head -1) |"
            echo "| \`python3\` | $(python3 --version 2>&1) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # fdroidserver 读的是**本地目录**里的 APK（这是 REFS F7 的根因），所以这里
      # 把 APK 落成 `fdroid/repo/` 的结构 —— 而不是喂它一个远程 URL。
      - name: Build a minimal repo
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo fdroid/metadata

          for a in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk; do
            echo "== 下载 $a"
            curl -fsSL --retry 3 -o "fdroid/repo/$a" "$BASE/$a"
          done
          ls -l fdroid/repo

          # metadata 用 printf 逐行写、不用 heredoc：`run: |` 块的内容整体缩进，
          # heredoc 里的行会连带缩进，写出来的 YAML 就多一层前导空格。
          #
          # `AutoUpdateMode/UpdateCheckMode: None` 是关键 —— 它把 fdroidserver 降级成
          # **纯 index 生成器**，不去自己找更新。这正是本市场「执行体抓上游、别人只管产物」
          # 的分工（REFS F5），也是 `fdroid update` 在本 workflow 里不联网的原因。
          printf '%s\n' \
            'Categories:' \
            '  - Internet' \
            'License: MIT' \
            'SourceCode: https://github.com/ImranR98/Obtainium' \
            'IssueTracker: https://github.com/ImranR98/Obtainium/issues' \
            'Summary: Obtainium' \
            'Description: |' \
            '    Get Android app updates directly from the source.' \
            'AutoUpdateMode: None' \
            'UpdateCheckMode: None' \
            > "fdroid/metadata/$PKG.yml"
          cat "fdroid/metadata/$PKG.yml"

      # 一次性测试 key。**不要**用真仓库那把：那把要离线备份且不可轮换（换 = 所有客户端
      # 重新添加源），只属于部署期。这里的 key 跟着 CI 一起消失。
      - name: Generate throwaway keystore and config
        run: |
          set -euo pipefail
          DN='CN=market-of-labs spike, OU=spike, O=market-of-labs, L=NA, C=CN'
          keytool -genkeypair \
            -keystore fdroid/keystore.jks -storetype JKS \
            -alias spikekey -keyalg RSA -keysize 2048 -validity 365 \
            -storepass spikepass -keypass spikepass -dname "$DN"

          printf '%s\n' \
            'repo_url: https://example.com/fdroid/repo' \
            'repo_name: market-of-labs spike' \
            'repo_description: fdroidserver + jarsigner spike (throwaway key, not a real repo)' \
            'keystore: keystore.jks' \
            'repo_keyalias: spikekey' \
            'keystorepass: spikepass' \
            'keypass: spikepass' \
            "keydname: \"$DN\"" \
            > fdroid/config.yml
          # 0600 否则 fdroid 会打一句 unsafe permissions 的警告（①那次就跑出来了）。
          chmod 600 fdroid/config.yml
          cat fdroid/config.yml

      - name: fdroid update
        run: |
          set -euo pipefail
          cd fdroid
          fdroid update --pretty
          cd ..
          echo "== 产物 =="
          find fdroid/repo -type f | sort

      # 断言**不用 `set -e`**：一次跑完所有检查、把结论一次给全，比"第一个失败就中断"
      # 有用得多 —— 这个 job 的价值就在于把"哪几条成立、哪几条不成立"一次说清。
      #
      # `if: always()` 是刻意的：①那次 `fdroid update` 一失败，这一步就被 skip，
      # 于是"到底缺了哪些产物"一个字都没留下。让它照跑，红的那几条本身就是现场记录。
      - name: Assert artifacts
        if: always()
        # ⚠️ **必须显式覆盖 shell。** GitHub 给内置 `bash` 用的命令行是
        # `bash --noprofile --norc -e -o pipefail {0}` —— 那个 `-e` 写在命令行上，
        # 脚本里的 `set -uo pipefail` **关不掉它**。少了下面这一行，"跑完所有断言、
        # 一次给全结论"的设计就是空的：第一条非零命令静默终止整步，日志里只有一句
        # `##[error]Process completed with exit code 1.`。
        #
        # 这次没出事纯属**碰巧**：前几条断言都是 `t "…" test -f …`，而 `if` 天然免疫 `-e`。
        # 真正暴露它的是 `spike-keystore.yml`（run 35292638722，本步 0.3 秒 exit 1、零输出），
        # 那条链的第一条命令是 `keytool … | grep`，grep 没选中就返回 1，当场毙命。
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          set -uo pipefail

          pass=0; failn=0; report=""
          ok() { report+="- ✅ $1"$'\n'; pass=$((pass+1)); }
          no() { report+="- ❌ $1"$'\n'; failn=$((failn+1)); }
          t()  { local d="$1"; shift; if "$@" >/dev/null 2>&1; then ok "$d"; else no "$d"; fi; }

          t "entry.jar 存在"            test -f fdroid/repo/entry.jar
          t "index-v2.json 存在"        test -f fdroid/repo/index-v2.json
          t "index-v1.jar 存在"         test -f fdroid/repo/index-v1.jar
          t "entry.jar 恰有 4 个条目"   test 4 -eq "$(unzip -Z1 fdroid/repo/entry.jar 2>/dev/null | wc -l)"
          t "entry.jar 内含 entry.json" grep -qxF entry.json <(unzip -Z1 fdroid/repo/entry.jar 2>/dev/null)
          t "index-v2.json 是合法 JSON" jq -e . fdroid/repo/index-v2.json
          t "index-v2 含 $PKG"          jq -e --arg p "$PKG" '.packages[$p]' fdroid/repo/index-v2.json
          t "$PKG 在 v2 里有 2 个变体"  jq -e --arg p "$PKG" '.packages[$p].versions | length == 2' fdroid/repo/index-v2.json
          t "v2 每个变体都有 signer"    jq -e --arg p "$PKG" '[.packages[$p].versions[].manifest.signer] | all(. != null)' fdroid/repo/index-v2.json
          t "v2 每个变体都有 64 位 sha256" \
            jq -e --arg p "$PKG" '[.packages[$p].versions[].file.sha256] | all(. != null and (. | length) == 64)' fdroid/repo/index-v2.json

          # 客户端安装前校验的哈希链：entry.json 里记的 sha256 必须等于 index-v2.json 的实际值。
          want=$(unzip -p fdroid/repo/entry.jar entry.json 2>/dev/null | jq -r '.index.sha256')
          got=$(sha256sum fdroid/repo/index-v2.json | cut -d' ' -f1)
          if [ -n "$want" ] && [ "$want" = "$got" ]; then
            ok "entry.json → index-v2.json 的 sha256 链自洽"
          else
            no "sha256 链断裂（entry 记 ${want:-空}，实际 $got）"
          fi

          # 自签名证书会让 jarsigner 带一句告警，所以不看退出码，只看那句结论行。
          jout=$(jarsigner -verify fdroid/repo/entry.jar 2>&1 || true)
          if grep -q "jar verified" <<<"$jout"; then
            ok "jarsigner 验证 entry.jar 通过"
          else
            no "jarsigner 未通过（$(head -2 <<<"$jout" | tr '\n' ' ')）"
          fi

          nc=$(jq -r --arg p "$PKG" '[.packages[$p].versions[].manifest.nativecode[]] | sort | join(",")' fdroid/repo/index-v2.json 2>/dev/null)
          if [ "$nc" = "arm64-v8a,armeabi-v7a" ]; then
            ok "nativecode 覆盖两个 ABI（$nc）"
          else
            no "nativecode 实得「${nc:-空}」，期望 arm64-v8a,armeabi-v7a"
          fi

          # v1 的 packages[pkg] 是**列表**，v2 的 versions 是以 file 的 sha256 为 key 的
          # map —— 两者都应表达出这 2 个变体。
          v1=$(unzip -p fdroid/repo/index-v1.jar index-v1.json 2>/dev/null | jq -r --arg p "$PKG" '.packages[$p] | length' 2>/dev/null)
          if [ "$v1" = "2" ]; then
            ok "index-v1 里同一包有 2 个 apk"
          else
            no "index-v1 里该包 apk 数 = ${v1:-解析失败}"
          fi

          # 把"上游的两个 ABI 变体 versionCode 并不相同"这件事**钉成一条断言**：
          # 本市场的账本只记了一个 versionCode（见 REFS），这条红了说明上游换了打包方式，
          # 那个缺口要重新评估。
          vc=$(jq -r --arg p "$PKG" '[.packages[$p].versions[].manifest.versionCode] | unique | length' fdroid/repo/index-v2.json 2>/dev/null)
          if [ "$vc" = "2" ]; then
            ok "两个 ABI 变体的 versionCode 不同（上游如此；账本只记一个）"
          else
            no "两个变体的 versionCode 去重后 = ${vc:-?}（预期 2）"
          fi

          {
            echo
            echo "### 断言"
            echo
            echo "**$pass 通过 / $failn 失败**"
            echo
            echo "$report"
            echo
            echo "### entry.jar 的条目（对照 IzzyOnDroid 那个 4 条目实例）"
            echo
            echo '```'
            unzip -Z1 fdroid/repo/entry.jar 2>&1 || true
            echo '```'
            echo
            echo "### entry.json"
            echo
            echo '```json'
            unzip -p fdroid/repo/entry.jar entry.json 2>/dev/null | jq . 2>&1 | head -30 || true
            echo '```'
            echo
            echo "### fdroid/repo 下的 APK —— 验「有没有被改名」：实测结论是**没有**"
            echo
            echo '```'
            ls -l fdroid/repo/*.apk 2>&1 || true
            echo '```'
            echo
            echo "### index-v2.json 里该包的全部版本"
            echo
            echo '```json'
            jq --arg p "$PKG" '.packages[$p].versions' fdroid/repo/index-v2.json 2>&1 | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "pass=$pass fail=$failn"
          [ "$failn" -eq 0 ]

      # 产物上传是为了**真机那一步**：把 repo 拉下来用 Omnify 添加自定义源，验
      # 「添加源 → 安装 → 更新」以及私密源 + basic auth 的观感（REFS §7 第 2 条）。
      # ⚠️ 不带 keystore / config.yml：一次性 key 也没必要养成随产物走的习惯。
      - name: Upload the generated repo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-repo-spike
          path: |
            fdroid/repo
            fdroid/metadata
          retention-days: 14
