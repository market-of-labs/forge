name: 搬运队列

# 把 store 的 `_incoming` 暂存队列搬进各自的正式 Release，重建清单与索引，然后回写。
#
# **不要加 issues / issue_comment / pull_request_target / release / push** ——
# forge 是公有仓库，而这个 job 里带着能写 store 的 PAT。
on:
  repository_dispatch:
    # `types:` 就是路由。打过来一个这里没列的事件类型时，GitHub 返回 204 且什么都不做
    # —— 没有报错、没有日志。所以"让 forge 挂上新监听"必须先于"让 store 开始发"。
    types: [intake-incoming]
  # 手动按钮，给改执行体的人在这边调试用。store 侧也有一份同名按钮（那才是日常入口）
  # —— 两边等效，别把哪个当成多余的删掉。
  # 没有 inputs：本文件只有一件事。
  workflow_dispatch:

# 本仓库只有 workflow、没有源码，GITHUB_TOKEN 一个权限都不需要（取件与回写全走 PAT）。
# `actions/cache` 不吃这个字段 —— 它用的是 runtime token，与 GITHUB_TOKEN 无关。
permissions: {}

# 所有会写 store 的 job 共用一个并发组，于是它们互相排队（另外两个 workflow 里同名同组）。
# cancel-in-progress 必须是 false：中途取消会留下"asset 传了一半、索引还没重建"的中间态。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  intake-incoming:
    runs-on: ubuntu-latest
    # **裸的 ubuntu-latest：没有容器，也不装任何包**（2026-09-28 撤的）。
    #
    # 容器当年只为给下面那个 composite action 一个裸的 root 环境 —— 它直接 `apt-get`
    # （不带 sudo），而 `container:` 是 job 级键、放不进 action 里。
    # 这条链上扫描、写索引、签名全是纯 Go，要用的 `git` 与 https 根证书 ubuntu-latest 自带，
    # 所以那两样一起撤了。同日本仓最后一个还需要容器的入口（`verify-index.yml`）也被
    # 删掉：全仓现在没有一处 `container:`、也没有一处 apt 清单。
    #
    # ⚠️ 原文写的"搬完 `_incoming` 之后要 `RebuildAndCheck`（fdroidserver 重建索引）"
    # **已经作废**：`RebuildAndCheck` 现在是纯 Go。原文那句"少了它会在搬完文件之后才失败"
    # 也随之作废 —— 现在没有工具链可装，也就没有那个失败时点。
    # 上界，不是预留：与 reconcile 干的是同一件事，所以给同一个上界。
    timeout-minutes: 120
    steps:
      # 顺带导出 `FORGE_EXEC`。顺序不能换：掩码是 fetch-executor 的第一步。
      # `$/` 不是 `./`：`$/` 指本仓根，不需要先 checkout（没有源码要取，
      # store 是二进制自己浅克隆的）。
      - name: 取执行体
        uses: $/.github/actions/fetch-executor
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 搬 _incoming
        env:
          # 一切外部数据只经 env 传入；run: 里是固定脚本文本（禁止 ${{ }} 插值）。
          STORE_TOKEN: ${{ secrets.GH_PAT }}
          REPO_KEYSTORE_B64: ${{ secrets.REPO_KEYSTORE_B64 }}
          REPO_KEYSTORE_PASS: ${{ secrets.REPO_KEYSTORE_PASS }}
          REPO_KEY_PASS: ${{ secrets.REPO_KEY_PASS }}
        run: |
          set -euo pipefail
          # 这里原有一行"cache 目录里有几个 APK"，随跨轮 APK cache 一起删（2026-09-28）。
          "$FORGE_EXEC" intake-incoming
