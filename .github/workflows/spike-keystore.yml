name: spike-keystore

# ⚠️ 一次性验证，**不是**生产流程，跑完就删。它验证的是 `spike-fdroid-repo.yml`
# **验不了**的那两件事 —— 那一次的 keystore 是现场生成的、APK 取自公开上游，
# 所以它证明不了任何与"真仓库"有关的东西：
#
#   1. **真仓库那把签名 key（`FDROID_KEYSTORE_B64`）能不能完好地穿过 secret 落到 CI**。
#      这是本轮唯一无法在本机自证的事：本机编码是对的就够了吗？不够 —— 中间还有
#      `gh secret set` 的存储、Actions 的注入、base64 的解码三道手。而它错了的后果
#      不是"报错"，是**用另一把 key 签了一个看起来完全正常的 entry.jar**（F-Droid
#      客户端会全部拒绝，而日志里没有任何异常）。
#   2. **APK 从 `store` 的 Release 拿**（而不是从公开上游的 `releases/latest/download`
#      直链）。生产的取件路径是「PAT + asset id + `Accept: application/octet-stream`」，
#      这条路径从来没有被跑过。
#
# 它同时把 `spike-fdroid-repo.yml` 的断言**整套继承**下来当回归：同一批产物、同一批
# 判据，换成一个真实的 APK 与一把真实的 key 再跑一遍。
#
# ⚠️ 触发面与 spike 不同，故意用 `push`：这个文件**只活在 `spike/**` 分支上**，
# 而 `workflow_dispatch` 要求 workflow 存在于**默认分支**才能被派发，所以按钮在这里
# 按不动。`push` 没有那条限制 —— 推分支即运行，且 `branches` 限定它碰不到 master。
#
# ⚠️ 跑完要确认这一步没把 keystore 留在任何地方：它落在 `$RUNNER_TEMP`，
# 且**不上传 artifact**（产物里只放 repo，不放 key）。
#
# ⚠️ **实测记录（run 35292638722，2026-09-18）—— 两条结论都已成立。**
#
#   ① **secret 完好地穿过了整条链**：解出来的 keystore 是 **3932 字节**（与本机
#      `repo-signing.jks` 逐字节同尺寸），且 `keytool` 报的 SHA-256 指纹与本机那把
#      **逐位相同**。这是本 workflow 存在的首要理由，已闭合。
#   ② **APK 能从 store 的 Release 按 asset id 取到**：两个 ABI 分片按文件名落到
#      `fdroid/repo/`，`fdroid update` 打出 `INFO: Finished`，并且它报出的签名指纹
#      与本机那把一致 ⇒ **索引真的是用生产 key 签的**。
#
#   同一次的副产物（对生产有用）：
#      · `fdroid update` 除了 `index-v1.jar` 还会生成 **`index.jar`**、`index.html`、
#        `index.xml`、`index.png`、`icons/icon.png`（占位图，伴随一句 repo_icon 的
#        WARNING）、以及 **`status/running.json`** —— 最后这个每轮都写，
#        所以 `status/` 必须排除在回写之外（否则每轮都产生一次无意义的 diff）。
#      · APK **没有**被改名（`dev.imranr.obtainium-1.6.17-arm64-v8a.apk`），D63 再次成立。
#
#   ⚠️ 但这一次的 **Assert artifacts 步骤本身是坏的**，与上面两条无关 —— 它踩了三个坑，
#      每一个都只在 CI 里才暴露出来，三条都已在下面对应位置写清：
#        1. GitHub 给内置 `bash` 的命令行里**写死了 `-e`**，脚本里的 `set -uo pipefail`
#           关不掉它 ⇒ "一次给全结论"的断言块从来没生效过（本步 0.3 秒 exit 1、零输出）。
#        2. `keytool` 打的是 `SHA-256`（带连字符），原来的 grep 找的是 `SHA256`。
#        3. fdroidserver 报的指纹是**空格分隔**、且在标题行的**下一行**，
#           拿带冒号的 WANT_FPR 直接 grep 日志永远匹配不上。

on:
  push:
    branches:
      - 'spike/**'

# 本 job 不 checkout、不写任何仓库，只需要能读 store 的 Release，
# 那是 PAT 的权限，与 GITHUB_TOKEN 无关。
permissions: {}

jobs:
  keystore:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    env:
      # 只取**最新版**的 ABI 分片 —— 这正是本轮定的政策（老版本靠 cache 累积，
      # 而这个 job 不碰 cache）。1.6.17 是账本里最新的那版。
      WANT_VERSION: '1.6.17'
      PKG: dev.imranr.obtainium
      STORE_REPO: market-of-labs/store
      # 本机生成那把 key 的指纹。**这是公开信息**（它会被写进每个客户端添加源时
      # 看到的那行），所以放在 workflow 里不构成泄漏 —— 而它换来的是本条 job 最硬
      # 的一条断言：CI 里的 key 与你本机那把**是同一把**，不是随便一把能用的 key。
      WANT_FPR: 'A4:7E:2F:72:2F:A1:73:40:59:2D:43:CB:69:F7:0B:D7:33:E0:41:AC:B9:71:1A:ED:78:C6:C6:87:05:16:3D:C8'
    steps:
      # 掩码必须**先于**任何可能打印它们的步骤。`::add-mask::` 是 job 级生效的。
      #
      # ⚠️ 用 `if` 而不是 `[ -n "$v" ] && echo ...`：后者挂在 `set -e` 下时，
      # 若最后一个 value 是空的，整步会以退出码 1 收场，而报错信息（"step failed"）
      # 与真实原因（某个 secret 没配）毫无关系。
      - name: Mask secrets
        env:
          T: ${{ secrets.GH_PAT }}
          K: ${{ secrets.FDROID_KEYSTORE_B64 }}
          S: ${{ secrets.FDROID_KEYSTORE_PASS }}
          P: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          for v in "$T" "$K" "$S" "$P"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

      - name: Install fdroidserver and JDK
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            fdroidserver default-jdk-headless bash unzip jq curl ca-certificates nodejs

      # 这一步是本 job 存在的理由。keystore 落在 `$RUNNER_TEMP`（**不是**
      # `$GITHUB_WORKSPACE`）：工作区是会被 artifact 上传与后续步骤翻动的地方，
      # 私钥没有任何理由出现在那里。
      - name: Decode the repo signing keystore
        env:
          B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/repo-signing.jks"
          # printf '%s'（不是 echo）不带尾换行；base64 -d 两者都能吃，但少了
          # 这个变量就少一个"到底是不是多了个字节"的疑问。
          printf '%s' "$B64" | base64 -d > "$ks"
          chmod 600 "$ks"

          echo "keystore 解开后 $(stat -c%s "$ks") 字节"

          # 立刻自证：解不开就在这里红，而不是等 fdroid update 神秘失败。
          keytool -list -keystore "$ks" -storepass "$PASS" -alias market-of-labs
          echo "KS=$ks" >> "$GITHUB_ENV"

      - name: Fetch the latest APK set from the store Release
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo fdroid/metadata

          # 先取 Release 的元数据，再按 **asset id** 取字节 —— 这正是生产里
          # `gh.DownloadAsset` 的路径。不手工拼 `releases/download/<tag>/<file>`：
          # 那条路绕开了客户端的重试与鉴权，而且会把同一个逻辑实现两遍。
          api="https://api.github.com/repos/$STORE_REPO/releases/tags/$PKG"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" -o rel.json

          echo "该 Release 的 asset："
          jq -r '.assets[].name' rel.json

          # 只要 WANT_VERSION 那两个 ABI 分片。
          mapfile -t names < <(jq -r --arg v "-$WANT_VERSION-" \
            '.assets[].name | select(contains($v))' rel.json)
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::Release 里找不到包含 $WANT_VERSION 的 asset"
            exit 1
          fi

          for name in "${names[@]}"; do
            id=$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' rel.json)
            echo "== 下载 $name（id=$id）"
            # curl ≥7.58 在**跨主机**重定向时不会转发 Authorization，所以这里
            # 可以放心用 -L：token 只到 api.github.com，不会跟着去对象存储。
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "fdroid/repo/$name" \
              "https://api.github.com/repos/$STORE_REPO/releases/assets/$id"
          done

          ls -l fdroid/repo
          # 空目录必须在这里就拦住：否则后面 fdroid update 会"成功地"产出一个
          # 零应用的索引，而所有断言依然全绿。
          test -n "$(find fdroid/repo -name '*.apk' -print -quit)"

      - name: Write metadata and config with the real key
        env:
          PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          # 用 printf 逐行写而不是 heredoc：`run: |` 块整体缩进，heredoc 的内容
          # 会连带缩进，写出来的 YAML 就多一层前导空格。
          printf '%s\n' \
            'Categories:' \
            '  - Internet' \
            'SourceCode: https://github.com/ImranR98/Obtainium' \
            'IssueTracker: https://github.com/ImranR98/Obtainium/issues' \
            'Summary: Obtainium' \
            'AutoUpdateMode: None' \
            'UpdateCheckMode: None' \
            > "fdroid/metadata/$PKG.yml"

          printf '%s\n' \
            'repo_url: https://example.com/fdroid/repo' \
            'repo_name: market-of-labs' \
            'repo_description: keystore plumbing spike (real key, throwaway output)' \
            "keystore: $KS" \
            'repo_keyalias: market-of-labs' \
            "keystorepass: $PASS" \
            "keypass: $PASS" \
            'keydname: "CN=market-of-labs, OU=fdroid repo, O=market-of-labs, L=NA, ST=NA, C=CN"' \
            > fdroid/config.yml
          chmod 600 fdroid/config.yml
          # ⚠️ 不回显 config.yml：它现在含**真口令**（spike 那份是一次性的，
          # 所以它敢 cat；这份不能照抄那个习惯）。
          echo "config.yml 已写（$(stat -c%s fdroid/config.yml) 字节，未回显）"

      - name: fdroid update
        run: |
          set -euo pipefail
          cd fdroid
          fdroid update --pretty 2>&1 | tee /tmp/fdroid.log
          cd ..
          find fdroid/repo -type f | sort

      # 断言不用 `set -e`：一次给全结论比"第一个失败就中断"有用得多。
      # `if: always()` 是刻意的 —— fdroid update 一失败，没有它这一步会被整个 skip，
      # 于是"到底缺了什么"一个字都不留。
      - name: Assert artifacts
        if: always()
        # ⚠️⚠️ **必须显式覆盖 shell**。GitHub 给内置 `bash` 用的命令行是
        #
        #     bash --noprofile --norc -e -o pipefail {0}
        #
        # —— 那个 `-e` 是**写在命令行上的**，脚本里的 `set -uo pipefail` 只是再加选项，
        # 它**关不掉** `-e`。于是"跑完所有断言、一次给全结论"这个设计**从来没生效过**：
        # 第一条返回非零的命令就会静默终止整步，而且日志里只有一句
        # `##[error]Process completed with exit code 1.`，指向不了任何具体断言。
        #
        # run 35292638722 实测：本步在 **0.3 秒**内以 exit 1 结束，一行输出都没有。
        # 下面这一行把 `-e` 摘掉、只留 pipefail，断言块才是它本来的样子。
        #
        # ⚠️ 同一个坑在 `spike-fdroid-repo.yml` 里也踩着（它那次只是**碰巧**没事：
        # 它的前几条断言都是 `t "…" test -f …` 这种 `if` 包着的形状，`if` 天然免疫 `-e`）。
        # 任何"失败不中断、一次给全"的 shell 块都要写这一行。
        shell: bash --noprofile --norc -o pipefail {0}
        env:
          PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          set -uo pipefail

          pass=0; failn=0; report=""
          ok() { report+="- ✅ $1"$'\n'; pass=$((pass+1)); }
          no() { report+="- ❌ $1"$'\n'; failn=$((failn+1)); }
          t()  { local d="$1"; shift; if "$@" >/dev/null 2>&1; then ok "$d"; else no "$d"; fi; }

          # ---- 本 job 独有的两条：secret 完整性 -------------------------------

          # 把 keystore 自己的指纹与**本机生成时那个**比。这一条过了，就说明
          # base64 → gh secret → Actions 注入 → 解码这条链**一个字节都没走样**。
          #
          # ⚠️ 模式是 `SHA-?256` 而不是 `SHA256`：keytool **带连字符**。
          # 实测 JDK 21 打的是 `Certificate fingerprint (SHA-256): A4:7E:…`，
          # 而不带连字符时 grep 一行都选不中 → 退出码 1 → 在 pipefail 与（当时还没被
          # 摘掉的）注入 `-e` 下**一击致命**：整步 exit 1，日志里一行断言都没有，
          # 报错只指向"进程退出码 1"，完全指不到这里。
          #
          # `|| true` 是防御：这条命令取不到值时应当由下面的比较去报"实得空"，
          # 而不是让整步静默死掉。
          fpr=$(keytool -list -keystore "$KS" -storepass "$PASS" 2>/dev/null \
                  | grep -oiE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1) || true
          if [ "$fpr" = "$WANT_FPR" ]; then
            ok "secret 里的 keystore 与本机那把是同一把（指纹吻合）"
          else
            no "keystore 指纹不符：实得「${fpr:-空}」"
          fi

          # fdroidserver 自己报的签名 key 也应是同一个 —— 两个不同的消费者
          # 读同一份 keystore，都得出同一个答案。
          #
          # ⚠️ 它打的指纹是**空格分隔、且分两行**（实测 JDK 21 + fdroidserver 2.2.x）：
          #
          #     INFO: Creating signed index with this key (SHA256):
          #     INFO: A4 7E 2F 72 … 3D C8
          #
          # 所以先 grep 到 `Creating signed index` 那一行、再取**它的下一行**，
          # 并把两边的分隔符都归一成空格。直接拿带冒号的 WANT_FPR 去 grep 日志
          # **永远匹配不上** —— 而这一条恰恰是最该信的那条：它证明的是
          # **签名真的用了这把 key**，而不是"keystore 文件没坏"。
          signed_fpr=$(grep -aA1 'Creating signed index with this key' /tmp/fdroid.log 2>/dev/null \
                        | tail -1 | sed 's/^[0-9-]* [0-9:,]* INFO: //' | tr -s ' ' | sed 's/^ *//;s/ *$//') || true
          want_spaced=$(tr ':' ' ' <<<"$WANT_FPR" | tr -s ' ')
          if [ -n "$signed_fpr" ] && [ "$signed_fpr" = "$want_spaced" ]; then
            ok "fdroidserver 用它签了索引，且指纹就是本机那把"
          else
            no "fdroidserver 报出的签名 key 不是本机那把（实得「${signed_fpr:-空}」）"
          fi

          # ---- 以下继承 spike-fdroid-repo.yml 的整套断言 ----------------------

          t "entry.jar 存在"          test -f fdroid/repo/entry.jar
          t "index-v2.json 存在"      test -f fdroid/repo/index-v2.json
          t "index-v1.jar 存在"       test -f fdroid/repo/index-v1.jar
          t "entry.jar 恰有 4 个条目" test 4 -eq "$(unzip -Z1 fdroid/repo/entry.jar 2>/dev/null | wc -l)"
          t "index-v2.json 是合法 JSON" jq -e . fdroid/repo/index-v2.json
          t "index-v2 含 $PKG"        jq -e --arg p "$PKG" '.packages[$p]' fdroid/repo/index-v2.json
          t "$PKG 在 v2 里有 2 个变体" jq -e --arg p "$PKG" '.packages[$p].versions | length == 2' fdroid/repo/index-v2.json
          t "v2 每个变体都有 signer"  jq -e --arg p "$PKG" '[.packages[$p].versions[].manifest.signer] | all(. != null)' fdroid/repo/index-v2.json
          t "v2 每个变体都有 64 位 sha256" \
            jq -e --arg p "$PKG" '[.packages[$p].versions[].file.sha256] | all(. != null and (. | length) == 64)' fdroid/repo/index-v2.json
          t "v2 每个变体的 versionCode > 0" \
            jq -e --arg p "$PKG" '[.packages[$p].versions[].manifest.versionCode] | all(. > 0)' fdroid/repo/index-v2.json

          want=$(unzip -p fdroid/repo/entry.jar entry.json 2>/dev/null | jq -r '.index.sha256')
          got=$(sha256sum fdroid/repo/index-v2.json | cut -d' ' -f1)
          if [ -n "$want" ] && [ "$want" = "$got" ]; then
            ok "entry.json → index-v2.json 的 sha256 链自洽"
          else
            no "sha256 链断裂（entry 记 ${want:-空}，实际 $got）"
          fi

          if [ "$(unzip -p fdroid/repo/entry.jar entry.json 2>/dev/null | jq -r '.version')" = "20002" ]; then
            ok "entry.json.version == 20002"
          else
            no "entry.json.version 不是 20002"
          fi

          # 自签名证书会让 jarsigner 带告警并非零退出，所以不看退出码，只看结论行。
          jout=$(jarsigner -verify fdroid/repo/entry.jar 2>&1 || true)
          if grep -q "jar verified" <<<"$jout"; then
            ok "jarsigner 验证 entry.jar 通过"
          else
            no "jarsigner 未通过（$(head -2 <<<"$jout" | tr '\n' ' ')）"
          fi

          # ---- 本市场自己的契约：APK 不许被改名（D63） -------------------------
          #
          # 这条对**我们**比 spike 那次更重要：客户端的取件地址是
          # `repo.address + "/" + file.name`，而网关按 **asset 名** 去 Release 取。
          # 两者一旦分叉，索引里的每个 file.name 都会 404。
          for a in $(jq -r --arg p "$PKG" '.packages[$p].versions[].file.name' fdroid/repo/index-v2.json); do
            if [ -f "fdroid/repo/$a" ]; then
              ok "file.name 与磁盘上的 asset 名逐字一致：$a"
            else
              no "索引里的 file.name 在磁盘上不存在：$a"
            fi
          done

          {
            echo
            echo "### 断言"
            echo
            echo "**$pass 通过 / $failn 失败**"
            echo
            echo "$report"
            echo
            echo "### fdroidserver 报出的签名 key"
            echo
            echo '```'
            grep -i 'signed index with this key' /tmp/fdroid.log 2>&1 || echo '（没有这一行）'
            echo '```'
            echo
            echo "### 索引里的文件名（应与 Release 里的 asset 名逐字相同）"
            echo
            echo '```'
            jq -r --arg p "$PKG" '.packages[$p].versions[].file.name' fdroid/repo/index-v2.json 2>&1 || true
            echo '```'
            echo
            echo "### index-v2.json 的 repo 块"
            echo
            echo '```json'
            jq '.repo' fdroid/repo/index-v2.json 2>&1 | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "pass=$pass fail=$failn"
          [ "$failn" -eq 0 ]

      # ⚠️ 只传 repo 与 metadata，**绝不**传 keystore / config.yml：
      # 那份 keystore 是生产唯一的签名私钥，它没有任何理由跟着产物走。
      - name: Upload the generated repo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-repo-keystore-spike
          path: |
            fdroid/repo
            fdroid/metadata
          retention-days: 7
