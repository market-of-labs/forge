name: 处理申请单

# 处理 store 里的一张申请单：新增单当场收录并只同步它自己，变更单直接改来源文件。
#
# **不要加 issues / issue_comment / pull_request_target / release / push** ——
# forge 是公有仓库，而这个 job 里带着能写 store 的 PAT。
# 这里处理的正文是**陌生人写的字符串**：防线在 `forge intake-issue` 里（DecideIntake
# 是纯函数），本文件的职责就是别把那面墙拆了 —— 所以下面 `run:` 里一处 `${{ }}` 都没有。
on:
  repository_dispatch:
    # `types:` 就是路由。store 侧的 `issues[opened, edited]` 转发过来时打的就是这个词。
    types: [source-change]
  # 手动按钮：单被漏掉、或想重跑一次时用（整条链幂等）。store 侧也有一份同名按钮。
  workflow_dispatch:
    inputs:
      issue:
        description: issue 编号（在 store 仓库里的编号）
        type: string
        required: true

# 本仓库只有 workflow、没有源码，GITHUB_TOKEN 一个权限都不需要（取件与回写全走 PAT）。
permissions: {}

# 与其他两个写入口共用一个并发组：这条链会当场建一个来源文件并回写 store。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  source-change:
    runs-on: ubuntu-latest
    # **裸的 ubuntu-latest：没有容器，也不装任何包**（2026-09-28 撤的）。
    #
    # 容器当年只为给下面那个 composite action 一个裸的 root 环境 —— 它直接 `apt-get`
    # （不带 sudo），而 `container:` 是 job 级键、放不进 action 里。这条链从头到尾都是
    # 纯 Go，要用的 `git` 与 https 根证书 ubuntu-latest 自带，所以那两样一起撤了。
    # ⚠️ 原文写的"链尾会调 `Reconcile(OnlyID)`，那一步要 fdroidserver 重建索引"
    # **已经作废**：`Reconcile` 现在是纯 Go（扫描、写索引、签名、核签名全在进程内），
    # 本入口连 apt 清单都没有了 —— 全仓都没有了：同日本仓最后一个还需要容器的入口
    # （`verify-index.yml`）也被删掉。
    # 上界，不是预留。
    timeout-minutes: 120
    steps:
      # 顺带导出 `FORGE_EXEC`。本 job 不碰 `_incoming`，链尾**也不一定有对账**：新增单走
      # `Reconcile(OnlyID)`，那一趟会重写整份索引（内容上只动这一个应用）；**变更单只改那一个
      # 来源文件就提交**（`intake.go` 的变更分支），索引与 README 那张表要等下一轮对账 —— 那张单
      # 给用户的答复本来就是"下一轮生效"。
      # `$/` 不是 `./`：`$/` 指本仓根，不需要先 checkout。
      - name: 取执行体
        uses: $/.github/actions/fetch-executor
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 处理申请单
        env:
          # 一切外部数据只经 env 传入；run: 里是固定脚本文本（禁止 ${{ }} 插值）。
          STORE_TOKEN: ${{ secrets.GH_PAT }}
          REPO_KEYSTORE_B64: ${{ secrets.REPO_KEYSTORE_B64 }}
          REPO_KEYSTORE_PASS: ${{ secrets.REPO_KEYSTORE_PASS }}
          REPO_KEY_PASS: ${{ secrets.REPO_KEY_PASS }}
          # 单号两个来源：手动按钮来自 input，信标来自 client_payload。两个操作数都只是
          # 读属性，谁在前都不会让 job 判假；填空了由二进制硬错（"缺少 issue 编号"）。
          ISSUE: ${{ github.event.inputs.issue || github.event.client_payload.issue }}
        run: |
          set -euo pipefail
          # 这里原有一行"cache 目录里有几个 APK"，随跨轮 APK cache 一起删（2026-09-28）。
          "$FORGE_EXEC" intake-issue
