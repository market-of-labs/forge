name: reconcile

# 触发面白名单（03 §4.2）：schedule 只有 GitHub 能发起，workflow_dispatch 要仓库写权限。
# 两者都不依赖任何外部输入，所以这个 workflow 的输入面是**空的** ——
# 它不会因为某个陌生人做了什么而跑起来。
on:
  schedule:
    # 每天**北京 02:17**（= 前一天 18:17 UTC）。⚠️ GitHub 的 cron 只认 UTC，且不认时区 ——
    # 所以这里写的是 UTC 值，换算成北京（UTC+8，无夏令时）要 **减 8 小时**。
    # 目标窗口是北京凌晨 2–6 点：定在窗口**开头**是因为整轮有 90 分钟的超时预算，
    # 从开头起跑才留得下余量 —— 定在 05:xx 的话，一次慢轮次或 runner 排队就会把它推出窗口。
    #
    # 用非整点分钟（`17` 而不是 `0`）避开全网同时打 GitHub API ——
    # 整点是最拥挤的时刻，而 runner 排队与上游限流都吃这个亏。
    - cron: '17 18 * * *'
  workflow_dispatch:

# 本仓库现在**只有 workflow，没有任何源码**（Go 源码与构建在私有的
# `market-of-labs/forge-core`）。所以这里不需要任何 GITHUB_TOKEN 权限：
# 执行体走 PAT 从 forge-core 拉，写 store 也走同一把 PAT（§6.2 不变量 1）。
permissions: {}

# 与 on-dispatch.yml 同名同组：这两个 workflow 是 store 的两个写入口，
# 共用一条队列就不会互相踩（GitHub 的并发组是**仓库级**的，跨 workflow 文件生效）。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # 对账要遍历所有上游、可能下载若干 APK，比事件处理慢。
    timeout-minutes: 90
    env:
      # 上游 asset 名。写死，不走变量 —— 它从不改变，而"能改的值"就是"会被改错
      # 的值"。action 按 **asset 原名**落盘，所以它同时就是本地文件名。
      # ⚠️ 改这里要同时改 `Fetch executor` 的 `with.fileName`（两处必须一致）。
      EXEC_ASSET: forge-linux-amd64
    steps:
      # 取执行体：从 forge-core 的 Release 拿**最新**的二进制（不钉 tag）。
      #
      # ⚠️ 这个二进制是**带着能写 store 的 PAT 执行的**，所以 forge-core 那边
      # "打 tag = 上生产"。浮动取 latest 是刻意的：改完代码打个 tag，本仓库
      # 一个字都不用动，下一轮对账就换新版。
      #
      # ⚠️ 掩码必须先发，且只能拆成独立一步：二进制自己那句 `::add-mask::` 只覆盖
      # 它**之后**的输出；而换成 action 之后，我们又没有它的 `run:` 可以写这一句。
      # `::add-mask::` 是 job 级生效的，所以放在 action **之前**仍然覆盖 action
      # 自己打的东西。
      - name: Mask token
        env:
          MASK: ${{ secrets.GH_PAT }}
        run: echo "::add-mask::$MASK"

      - name: Fetch executor
        uses: robinraju/release-downloader@v1
        with:
          repository: market-of-labs/forge-core
          # 不钉 tag = **浮动取 latest**（刻意的，见上面的理由）。
          latest: true
          fileName: forge-linux-amd64
          # 只能是 $GITHUB_WORKSPACE 下的相对路径。本 job 没有 checkout，但那个
          # 目录 runner 已经建好了 —— 空着，正好放一个二进制。
          out-file-path: .
          # ⚠️ 不能吃默认值（默认是 `github.token`）：forge-core 是私有仓库，
          # GITHUB_TOKEN 跨不了仓库（§6.2 不变量 1）。
          token: ${{ secrets.GH_PAT }}

      - name: Make executable
        # Release asset 不带执行位，得自己补。路径落在 $GITHUB_WORKSPACE 而不是
        # 原来的 $RUNNER_TEMP —— 这个 action 只往工作目录里放东西。
        run: chmod +x "$GITHUB_WORKSPACE/$EXEC_ASSET"

      # 一条命令跑完 §4.4 的四步：解析上游 → 镜像缺失版本 → 重建 index 与清单
      # （自检就在这一步里）→ 回写。**刻意不拆成多个 step**：拆开的话，中间某一步失败会留下
      # "镜像完了但清单没重建"的状态并让 workflow 变红，而实际上下一轮对账
      # 会把没做完的部分自然补上（§4.4 的幂等自愈）。
      #
      # 注意"单个应用镜像失败"是**被容忍**的（D44）：它记一条 ERROR、跳过那个应用、
      # 这一轮照常重建并回写，所以这一轮仍然是绿的 —— 判据是下面摘要行里的 `失败 z`。
      # 拆成多个 step 会把这个刻意设计的容忍重新变成一个红色中断。
      #
      # 自检不过时二进制**在回写之前**就停下并返回非零（§5.3），
      # 所以变红 = 真的有问题，不会出现"红着但东西已经推上去了"。
      # ⚠️ 反过来不成立：**绿不保证没问题** —— 被容忍的镜像失败就是绿的（上一段）。
      - name: Reconcile
        env:
          STORE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # 这里**不再**掩码：上面那个 `Mask token` 步骤已经 job 级生效（同一把 PAT），
          # 而二进制启动后第一件事也是 env.AddMask()。再掩一次是纯重复。
          "$GITHUB_WORKSPACE/$EXEC_ASSET" reconcile
