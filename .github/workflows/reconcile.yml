name: reconcile

# 触发面白名单（03 §4.2）：schedule 只有 GitHub 能发起，workflow_dispatch 要仓库写权限。
# 两者都不依赖任何外部输入，所以这个 workflow 的输入面是**空的** ——
# 它不会因为某个陌生人做了什么而跑起来。
on:
  schedule:
    # 每天 03:17 UTC。用非整点分钟（`17` 而不是 `0`）避开全网同时打 GitHub API ——
    # 整点是最拥挤的时刻，而 runner 排队与上游限流都吃这个亏。
    - cron: '17 3 * * *'
  workflow_dispatch:

# 本仓库现在**只有 workflow，没有任何源码**（Go 源码与构建在私有的
# `market-of-labs/forge-core`）。所以这里不需要任何 GITHUB_TOKEN 权限：
# 执行体走 PAT 从 forge-core 拉，写 store 也走同一把 PAT（§6.2 不变量 1）。
permissions: {}

# 与 on-dispatch.yml 同名同组：这两个 workflow 是 store 的两个写入口，
# 共用一条队列就不会互相踩（GitHub 的并发组是**仓库级**的，跨 workflow 文件生效）。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # 对账要遍历所有上游、可能下载若干 APK，比事件处理慢。
    timeout-minutes: 90
    env:
      # 执行体的仓库与文件名。写死，不走变量 —— 它们从不改变，而"能改的值"就是
      # "会被改错的值"。
      EXEC_REPO: market-of-labs/forge-core
      EXEC_ASSET: forge-linux-amd64
    steps:
      # 取执行体：从 forge-core 的 Release 拿**最新**的二进制（不钉 tag）。
      #
      # ⚠️ 这个二进制是**带着能写 store 的 PAT 执行的**，所以 forge-core 那边
      # "打 tag = 上生产"。浮动取 latest 是刻意的：改完代码打个 tag，本仓库
      # 一个字都不用动，下一轮对账就换新版。
      #
      # ⚠️ 这一步先于二进制运行，而二进制自己那句 `::add-mask::` 只覆盖它**之后**
      # 的输出 —— 所以 mask 必须在这里自己发一次。这不是特例：本仓库每个碰 token
      # 的 step 都是这个写法（与 store 侧 forward.yml 同一条规矩）。
      - name: Fetch executor
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_TOKEN"
          gh release download "$EXEC_REPO" --pattern "$EXEC_ASSET" \
            --output "$RUNNER_TEMP/forge-bin" --clobber
          chmod +x "$RUNNER_TEMP/forge-bin"

      # 一条命令跑完 §4.4 的四步：解析上游 → 镜像缺失版本 → 重建 index 与清单
      # → 自检 → 回写。**刻意不拆成多个 step**：拆开的话，中间某一步失败会留下
      # "镜像完了但清单没重建"的状态并让 workflow 变红，而实际上下一轮对账
      # 会把没做完的部分自然补上（§4.4 的幂等自愈）。
      #
      # 自检不过时二进制**在回写之前**就停下并返回非零（§5.3），
      # 所以变红 = 真的有问题，不会出现"红着但东西已经推上去了"。
      - name: Reconcile
        env:
          STORE_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STORE_TOKEN"
          "$RUNNER_TEMP/forge-bin" reconcile
