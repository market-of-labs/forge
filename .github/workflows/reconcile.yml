name: 全量对账

# 让 store 与上游重新对一遍：解析上游 → 镜像缺失版本 → 重建索引 → 回写。
on:
  repository_dispatch:
    # `types:` 就是路由，只认这一个词。**这一面有意留着，别顺手删掉**：撤掉一个已经
    # 发出去的 `types:` 不可逆（外部再发它时 GitHub 返回 204 且什么都不做）。
    types: [reconcile]
  schedule:
    # 每天北京 02:17（= 前一天 18:17 UTC）。GitHub 的 cron 只认 UTC。定在凌晨窗口的
    # 开头，是为了给整轮的超时预算留下余量；用非整点分钟避开全网同时打 API。
    - cron: '17 18 * * *'
  workflow_dispatch:

# 本仓库只有 workflow、没有源码，GITHUB_TOKEN 一个权限都不需要（取件与回写全走 PAT）。
# `actions/cache` 不吃这个字段 —— 它用的是 runtime token，与 GITHUB_TOKEN 无关。
permissions: {}

# 与 intake-incoming.yml / source-change.yml 同名同组：三个 workflow 都是 store 的写入口，
# 共用一条队列就不会互相踩（并发组是仓库级的，跨 workflow 文件生效）。
concurrency:
  group: store-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # 必须是 Debian 容器：ubuntu-latest 自带的 `fdroidserver 2.2.1` 解析现代 APK 会崩，
    # trixie 的才行。**别改回 ubuntu-latest。**
    container:
      image: debian:trixie
    # 容器 job 的默认 shell 是 sh(dash)，Debian 基础镜像里没有 bash。
    defaults:
      run:
        shell: bash
    # 耗时随索引增长而增长（要逐个解析 repo/ 下已攒起来的每个 APK），不是常量。
    timeout-minutes: 120
    steps:
      # `$/` 不是 `./`：`./` 要求先 checkout，而本 job 跑在 debian:trixie 里，
      # 那个镜像里没有 git —— 装 git 的那一步恰好就是本动作。这条流水线的设计前提
      # 本来也是不 checkout 任何东西。顺序不能换：掩码是 `取执行体` 的第一步。
      - name: 装工具链
        uses: $/.github/actions/setup-fdroid

      # 取执行体（浮动取 latest）并导出 `FORGE_EXEC`；那些理由都写在那个动作里。
      - name: 取执行体
        uses: $/.github/actions/fetch-executor
        with:
          token: ${{ secrets.GH_PAT }}

      # 一条命令跑完四步：解析上游 → 镜像缺失版本 → 重建 index（自检在内）→ 回写。
      # **刻意不拆成多个 step**：拆开会让中间某一步失败留下"镜像完了但索引没重建"的
      # 中间态，而下一轮对账本来会把没做完的部分自然补上。
      # "单个应用镜像失败"是被容忍的 —— 判据是下面摘要行里的 `失败 z`。
      # 自检不过时二进制在回写之前就停下并返回非零（反过来不成立：绿不保证没问题）。
      # keystore 没有独立步骤：二进制自己把它解到临时文件（`/tmp`，0600，在 store 克隆
      # 之外），在 workflow 里再解一遍是纯重复，还会让明文私钥多经过一个 shell。
      - name: Reconcile
        id: run
        env:
          STORE_TOKEN: ${{ secrets.GH_PAT }}
          REPO_KEYSTORE_B64: ${{ secrets.REPO_KEYSTORE_B64 }}
          REPO_KEYSTORE_PASS: ${{ secrets.REPO_KEYSTORE_PASS }}
          REPO_KEY_PASS: ${{ secrets.REPO_KEY_PASS }}
        run: |
          set -euo pipefail
          # 这里原有一行"cache 目录里有几个 APK"的现场证据，2026-09-28 随跨轮 APK cache
          # 一起删了。它当年回答的是"这一轮索引里的老版本是不是从 cache 里凑出来的" ——
          # 那个问题在账本成为唯一事实源之后就不存在了：盘上有几个 APK 不再决定索引里有
          # 几个版本，`sources/` 决定。
          "$FORGE_EXEC" reconcile

      # 只看一件事：**已经发布出去**的那份索引是不是我们那把 key 签的。用错 key 的失败是
      # 静默的（`jarsigner -verify` 照样绿），而 keystore 一旦发布就不可轮换。
      # 验的是克隆回来的 store，不是工作区 —— 二进制跑的临时浅克隆退出时就删了。
      # 位置：二进制在 `Reconcile` 里已经推送了，所以这是事后告警，不是闸门。
      - name: Verify the published index
        if: always()
        # 必须显式覆盖 shell：GitHub 给内置 bash 的命令行上带 `-e`，脚本里的
        # `set -uo pipefail` 关不掉它 —— 那会让"跑完所有断言、一次给全结论"变成
        # 第一条非零命令就静默终止。
        shell: bash --noprofile --norc -o pipefail {0}
        env:
          STORE_TOKEN: ${{ secrets.GH_PAT }}
          # 上一次核对通过的指纹。它不是秘密（证书本来就公开），写死在此正是重点：
          # 从 secret 里读就自证不了"没被人换过"。
          WANT_FPR: A4:7E:2F:72:2F:A1:73:40:59:2D:43:CB:69:F7:0B:D7:33:E0:41:AC:B9:71:1A:ED:78:C6:C6:87:05:16:3D:C8
          # 索引里 `repo.address` 该有的值。本仓是公有的，这个值等于门禁的唯一凭据
          # （客户端不做认证，知道地址 = 能下载全部包）⇒ 必须是 secret，不能写在这里。
          # 它是带 `/fdroid/repo` 后缀的那一版：fdroidserver 硬性要求 `repo_url` 以
          # `/repo` 结尾，别拿裸域名根来设这条 secret，那样这一步会恒红。
          WANT_ADDR: ${{ secrets.WANT_ADDR }}
          # 对账本身失败时，store 里那份是上一轮的产物，核对它没有意义。
          # 经 env 传入，不在 run: 里插值（run: 是固定脚本文本）。
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -uo pipefail

          if [ "$RUN_OUTCOME" != "success" ]; then
            {
              echo
              echo "### 发布物核对：**跳过**"
              echo
              echo '`Reconcile` 这一步没有成功，store 里那份产物还是上一轮的 —— '
              echo '核对它证明不了本轮的任何事。（本轮已经因为那一步变红了。）'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 先验自身前提：没装上的 `jq` 会以"index-v2.json 里没有 repo.address"的面目
          # 出现 —— 一条听起来像"产物坏了"、实际是"工具没装"的假故障。
          for tool in git jq keytool; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::找不到 \`$tool\` —— 本步跑不了，检查上面装工具链那一步的 apt 清单"
              exit 1
            fi
          done

          # 同一条道理：`WANT_ADDR` 没设时是空串，会让 ③ 变成读不懂的形状（且必然失败）。
          if [ -z "${WANT_ADDR:-}" ]; then
            echo "::error::secret \`WANT_ADDR\` 没设（或设成了空）—— 本步没法核对发布出去的地址"
            exit 1
          fi

          pass=0; failn=0; report=""
          ok() { report+="- ✅ $1"$'\n'; pass=$((pass+1)); }
          no() { report+="- ❌ $1"$'\n'; failn=$((failn+1)); }

          # 用 credential.helper 而不是把 token 写进 URL：后者会让 PAT 进 `git` 的
          # 命令行参数（同容器里任何进程都看得见）。
          git config --global credential.helper \
            '!f() { echo username=x-access-token; echo "password=$STORE_TOKEN"; }; f'

          PUB="$RUNNER_TEMP/published"
          rm -rf "$PUB"
          if ! git clone --depth 1 --quiet https://github.com/market-of-labs/store.git "$PUB" 2>&1; then
            echo "::error::克隆 store 失败 —— 下面没法核对"
            exit 1
          fi

          # 「store 里还没有 repo/」不是这一节的业务：该不该有索引由二进制自己把守
          # （BuildRepo 失败 ⇒ 不写回 ⇒ Reconcile 那一步已经红了）。迁移期跑旧二进制时
          # 不产 `repo/`，这个分支让那段时间的每日对账不因为一个无关的理由变红。
          if [ ! -d "$PUB/repo" ]; then
            {
              echo
              echo "### 发布物核对：**跳过**"
              echo
              echo 'store 里还没有 `repo/`。若这是迁移期，说明执行体还是**旧的**'
              echo '（旧二进制产 apps.json，不产 F-Droid 索引）；若迁移早已完成，'
              echo '那说明 `BuildRepo` 从没成功过 —— 去看 `Reconcile` 那一步的日志。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ① 产物在不在 —— 二进制自报 `committed=true`，这里看的是远端真的有了。
          if [ -f "$PUB/repo/entry.jar" ]; then
            ok "store 里确实有 repo/entry.jar"
          else
            no "store 里没有 repo/entry.jar —— 回写没落地（或 repo/ 压根没提交）"
          fi

          # ② 签名指纹。`keytool` 输出里 SHA256 是"32 组两位十六进制"，而 SHA1 只有
          # 20 字节，所以这个抽法正好只命中 SHA256 那一行。
          # 别去 grep fdroidserver 那句 `Creating signed index with this key`：索引没变化
          # 的轮次里它根本不打，拿它当判据 = 每隔几轮假红一次。
          got=$(keytool -printcert -jarfile "$PUB/repo/entry.jar" 2>/dev/null \
                  | grep -oiE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1) || true
          if [ -n "$got" ] && [ "$got" = "$WANT_FPR" ]; then
            ok "发布出去的 entry.jar 用的是预期的那把 key"
          else
            no "签名指纹不对：实得「${got:-空}」，期望「$WANT_FPR」—— **客户端会拒绝这个源**"
          fi

          # ③ 索引里记的仓库地址：客户端拿它拼每个 APK 的下载地址，不对 = 应用列表能出来、
          # 一个都装不上，而服务端这边不会有任何日志。
          # 比的是"发布出去的那份索引" vs 上面 env 里那条 secret —— 这是唯一一处不在 Go
          # 源码里的钉子，所以能抓到常量被改错（那边比的是常量自己，一起错也就一起绿）。
          idx="$PUB/repo/index-v2.json"
          # `-e` 让 jq 在取到 null 时自己返回非零，好把"jq 读不动文件"与"字段真的不在
          # 里面"分开报 —— 两者的修法完全不同。
          if ! addr=$(jq -er '.repo.address' "$idx" 2>/tmp/jq.err); then
            no "读不出 index-v2.json 的 repo.address（jq 报：$(tr -d '\n' </tmp/jq.err | head -c 200)）"
          elif [ "$addr" = "$WANT_ADDR" ]; then
            # 不打印值：它是 secret，日志里只会被掩成 `***`。
            ok "索引里的 repo.address 与期望值逐字相符"
          else
            case "$addr" in
              *.invalid*|*REPLACE-ME*)
                no "index-v2.json 里的 repo.address 还是占位值（$addr）—— 客户端能列出应用但装不了任何一个"
                ;;
              "")
                no "index-v2.json 的 repo.address 是空串 —— 客户端拼不出 APK 地址"
                ;;
              *)
                # 只印指纹不印值：走到这里也可能是"secret 被填错了"，而那时 $addr 就是
                # 正确的那个地址，印出来等于在公有仓的日志里公开它。
                no "index-v2.json 里的 repo.address 与期望值不符（实得 sha256:$(printf %s "$addr" | sha256sum | cut -c1-12)，期望 sha256:$(printf %s "$WANT_ADDR" | sha256sum | cut -c1-12)）—— 客户端会照它拼每个 APK 的地址，不符的后果是所有 APK 取不到"
                ;;
            esac
          fi

          pkgs=$(jq -r '.packages | length' "$idx" 2>/dev/null) || true

          {
            echo
            echo "### 发布物核对"
            echo
            echo "**$pass 通过 / $failn 失败**"
            echo
            echo "$report"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 索引里的包数 | ${pkgs:-?} |"
            # 这里也不打印地址本身：这个仓是公有的，摘要与日志一样人人可读。
            if [ "${addr:-}" = "$WANT_ADDR" ]; then
              echo "| \`repo.address\` | 与期望值相符 |"
            else
              echo "| \`repo.address\` | **不符** —— 见上面的 ❌ |"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          echo "pass=$pass fail=$failn"
          [ "$failn" -eq 0 ]
